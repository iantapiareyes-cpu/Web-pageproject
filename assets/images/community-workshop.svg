<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#1c1917"/>
  <!-- Workshop Room -->
  <rect x="40" y="30" width="520" height="340" rx="12" fill="#292524" stroke="#44403c"/>
  
  <!-- Presentation Screen -->
  <rect x="80" y="60" width="240" height="150" rx="8" fill="#0c0a09" stroke="#78716c" stroke-width="2"/>
  <rect x="95" y="80" width="80" height="10" rx="3" fill="#38bdf8"/>
  <rect x="95" y="100" width="140" height="8" rx="2" fill="#a8a29e"/>
  <rect x="95" y="115" width="180" height="8" rx="2" fill="#a8a29e"/>
  <rect x="95" y="130" width="110" height="8" rx="2" fill="#a8a29e"/>
  <rect x="95" y="150" width="70" height="20" rx="4" fill="#2563eb"/>
  <text x="130" y="164" fill="#ffffff" font-family="system-ui" font-size="10" font-weight="bold" text-anchor="middle">Live Code</text>

  <!-- Presenter: Ian -->
  <circle cx="370" cy="110" r="22" fill="#e2b998"/>
  <path d="M340 180 C340 140, 360 135, 370 135 C380 135, 400 140, 400 180 Z" fill="#2563eb"/>
  <line x1="340" y1="150" x2="310" y2="120" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
  <!-- Pointer beam -->
  <line x1="310" y1="120" x2="260" y2="105" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3"/>

  <!-- Audience Desks & Silhouettes -->
  <rect x="70" y="240" width="460" height="20" rx="4" fill="#44403c"/>
  <!-- Laptops -->
  <polygon points="120,240 140,240 138,225 122,225" fill="#a8a29e"/>
  <polygon points="240,240 260,240 258,225 242,225" fill="#a8a29e"/>
  <polygon points="360,240 380,240 378,225 362,225" fill="#a8a29e"/>
  <polygon points="460,240 480,240 478,225 462,225" fill="#a8a29e"/>

  <!-- Audience Heads -->
  <circle cx="130" cy="280" r="18" fill="#78716c"/>
  <circle cx="250" cy="280" r="18" fill="#78716c"/>
  <circle cx="370" cy="280" r="18" fill="#78716c"/>
  <circle cx="470" cy="280" r="18" fill="#78716c"/>

  <text x="300" y="345" fill="#e7e5e4" font-family="system-ui" font-size="14" font-weight="600" text-anchor="middle">
    Community Workshop: &quot;Modern Full-Stack Architecture with Node &amp; Web Standards&quot;
  </text>
</svg>
