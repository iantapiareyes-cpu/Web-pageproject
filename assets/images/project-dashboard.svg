<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#090d16"/>
  <!-- Top Bar -->
  <rect x="20" y="20" width="560" height="40" rx="8" fill="#131b2e"/>
  <circle cx="45" cy="40" r="6" fill="#3b82f6"/>
  <rect x="65" y="34" width="120" height="12" rx="4" fill="#94a3b8"/>
  <rect x="440" y="30" width="120" height="20" rx="6" fill="#2563eb"/>

  <!-- Left Sidebar -->
  <rect x="20" y="70" width="140" height="310" rx="8" fill="#131b2e"/>
  <rect x="35" y="90" width="110" height="14" rx="4" fill="#334155"/>
  <rect x="35" y="115" width="90" height="10" rx="3" fill="#64748b"/>
  <rect x="35" y="135" width="100" height="10" rx="3" fill="#64748b"/>
  <rect x="35" y="155" width="80" height="10" rx="3" fill="#64748b"/>
  <rect x="35" y="175" width="95" height="10" rx="3" fill="#64748b"/>

  <!-- Metric Cards -->
  <rect x="175" y="70" width="125" height="75" rx="8" fill="#1e293b"/>
  <text x="190" y="95" fill="#94a3b8" font-family="system-ui" font-size="11">Total Requests</text>
  <text x="190" y="125" fill="#38bdf8" font-family="system-ui" font-size="20" font-weight="bold">128,490</text>

  <rect x="310" y="70" width="125" height="75" rx="8" fill="#1e293b"/>
  <text x="325" y="95" fill="#94a3b8" font-family="system-ui" font-size="11">Uptime</text>
  <text x="325" y="125" fill="#4ade80" font-family="system-ui" font-size="20" font-weight="bold">99.98%</text>

  <rect x="445" y="70" width="135" height="75" rx="8" fill="#1e293b"/>
  <text x="460" y="95" fill="#94a3b8" font-family="system-ui" font-size="11">Response Avg</text>
  <text x="460" y="125" fill="#facc15" font-family="system-ui" font-size="20" font-weight="bold">42 ms</text>

  <!-- Big Chart -->
  <rect x="175" y="160" width="405" height="220" rx="8" fill="#131b2e"/>
  <text x="195" y="190" fill="#f8fafc" font-family="system-ui" font-size="14" font-weight="600">Throughput &amp; Cloud Performance Analytics</text>
  
  <!-- Chart Line Area -->
  <path d="M195 330 Q240 280 280 300 T360 250 T440 220 T520 200 T560 190" fill="none" stroke="#3b82f6" stroke-width="3.5"/>
  <path d="M195 330 Q240 280 280 300 T360 250 T440 220 T520 200 T560 190 L560 340 L195 340 Z" fill="#3b82f6" opacity="0.15"/>
  
  <!-- Data Dots -->
  <circle cx="280" cy="300" r="5" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/>
  <circle cx="360" cy="250" r="5" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/>
  <circle cx="440" cy="220" r="5" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/>
  <circle cx="520" cy="200" r="5" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/>
</svg>
