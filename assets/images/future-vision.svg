<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="#022c22"/>
  
  <text x="50" y="55" fill="#34d399" font-family="system-ui" font-size="12" font-weight="700" letter-spacing="1">5-YEAR ARCHITECTURAL TRAJECTORY</text>
  <text x="50" y="85" fill="#ffffff" font-family="system-ui" font-size="22" font-weight="bold">From Modern Web Engineer to Cloud Systems Architect</text>

  <!-- Timeline Nodes -->
  <!-- Node 1 -->
  <circle cx="80" cy="160" r="18" fill="#059669"/>
  <text x="80" y="165" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">Y1</text>
  <line x1="98" y1="160" x2="190" y2="160" stroke="#10b981" stroke-width="3" stroke-dasharray="4"/>
  <text x="80" y="205" fill="#6ee7b7" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">Full-Stack Fluency</text>
  <text x="80" y="225" fill="#a7f3d0" font-family="system-ui" font-size="10" text-anchor="middle">React 19 &bull; Node &bull; CI/CD</text>

  <!-- Node 2 -->
  <circle cx="210" cy="160" r="18" fill="#059669"/>
  <text x="210" y="165" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">Y2</text>
  <line x1="228" y1="160" x2="320" y2="160" stroke="#10b981" stroke-width="3" stroke-dasharray="4"/>
  <text x="210" y="205" fill="#6ee7b7" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">Cloud Scale</text>
  <text x="210" y="225" fill="#a7f3d0" font-family="system-ui" font-size="10" text-anchor="middle">K8s &bull; Microservices</text>

  <!-- Node 3 -->
  <circle cx="340" cy="160" r="18" fill="#059669"/>
  <text x="340" y="165" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">Y3</text>
  <line x1="358" y1="160" x2="450" y2="160" stroke="#10b981" stroke-width="3" stroke-dasharray="4"/>
  <text x="340" y="205" fill="#6ee7b7" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">Senior Role</text>
  <text x="340" y="225" fill="#a7f3d0" font-family="system-ui" font-size="10" text-anchor="middle">Lead 10k+ Dev Platform</text>

  <!-- Node 4 & 5 -->
  <circle cx="470" cy="160" r="22" fill="#10b981" stroke="#34d399" stroke-width="3"/>
  <text x="470" y="166" fill="#064e3b" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">Y5</text>
  <text x="470" y="205" fill="#34d399" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">Principal Architect</text>
  <text x="470" y="225" fill="#a7f3d0" font-family="system-ui" font-size="10" text-anchor="middle">Global Cloud Systems</text>

  <!-- Big Goal Focus Box -->
  <rect x="50" y="260" width="500" height="100" rx="10" fill="#064e3b" stroke="#059669"/>
  <text x="75" y="295" fill="#34d399" font-family="system-ui" font-size="14" font-weight="bold">Long-Term Milestone Commitment:</text>
  <text x="75" y="325" fill="#e2e8f0" font-family="system-ui" font-size="13">
    Architect and deploy a high-reliability distributed developer tooling service supporting over
  </text>
  <text x="75" y="345" fill="#e2e8f0" font-family="system-ui" font-size="13">
    10,000 active engineering teams, with 99.99% availability and zero data-loss guarantees.
  </text>
</svg>
