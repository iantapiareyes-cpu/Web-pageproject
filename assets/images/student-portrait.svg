<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5d0b5"/>
      <stop offset="100%" stop-color="#e2b998"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#171717"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="20" fill="url(#bgGrad)"/>
  <circle cx="200" cy="180" r="140" fill="#334155" opacity="0.3"/>

  <!-- Neck -->
  <rect x="175" y="210" width="50" height="60" rx="8" fill="url(#skinGrad)"/>
  
  <!-- Shoulders & Shirt -->
  <path d="M110 360 C110 270, 160 250, 200 250 C240 250, 290 270, 290 360 Z" fill="url(#shirtGrad)"/>
  <!-- Collar details -->
  <polygon points="175,250 200,285 225,250 200,260" fill="#1e40af"/>
  <polygon points="185,250 200,275 205,250" fill="#ffffff" opacity="0.9"/>

  <!-- Head Base -->
  <ellipse cx="200" cy="170" rx="60" ry="75" fill="url(#skinGrad)"/>
  
  <!-- Ears -->
  <ellipse cx="138" cy="170" rx="10" ry="16" fill="#e2b998"/>
  <ellipse cx="262" cy="170" rx="10" ry="16" fill="#e2b998"/>

  <!-- Hair Base -->
  <path d="M135 155 C135 105, 170 90, 200 90 C235 90, 265 105, 265 155 C265 130, 255 110, 200 110 C155 110, 140 135, 135 155 Z" fill="url(#hairGrad)"/>
  <path d="M140 130 C160 100, 240 100, 260 130 C240 115, 160 115, 140 130 Z" fill="#404040"/>

  <!-- Eyebrows -->
  <path d="M158 150 Q173 144 186 148" stroke="#171717" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <path d="M214 148 Q227 144 242 150" stroke="#171717" stroke-width="4.5" stroke-linecap="round" fill="none"/>

  <!-- Eyes -->
  <ellipse cx="172" cy="165" rx="7" ry="5.5" fill="#171717"/>
  <circle cx="174" cy="163" r="2" fill="#ffffff"/>
  <ellipse cx="228" cy="165" rx="7" ry="5.5" fill="#171717"/>
  <circle cx="230" cy="163" r="2" fill="#ffffff"/>

  <!-- Glasses -->
  <rect x="150" y="152" width="40" height="26" rx="8" fill="none" stroke="#0284c7" stroke-width="3"/>
  <rect x="210" y="152" width="40" height="26" rx="8" fill="none" stroke="#0284c7" stroke-width="3"/>
  <line x1="190" y1="162" x2="210" y2="162" stroke="#0284c7" stroke-width="3"/>
  <line x1="150" y1="162" x2="140" y2="164" stroke="#0284c7" stroke-width="2.5"/>
  <line x1="250" y1="162" x2="260" y2="164" stroke="#0284c7" stroke-width="2.5"/>

  <!-- Nose -->
  <path d="M198 165 L196 186 L204 187" stroke="#cb9b7b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Confident Smile -->
  <path d="M182 205 Q200 218 218 205" stroke="#a35d39" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M186 206 Q200 215 214 206" fill="#ffffff"/>

  <!-- Modern badge -->
  <g transform="translate(110, 340)">
    <rect width="180" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="90" y="22" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Ian Tapia Reyes</text>
  </g>
</svg>
