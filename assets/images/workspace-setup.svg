<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#wall)"/>
  
  <!-- Desk -->
  <rect x="50" y="280" width="500" height="20" rx="4" fill="#334155"/>
  <rect x="100" y="300" width="16" height="80" fill="#1e293b"/>
  <rect x="484" y="300" width="16" height="80" fill="#1e293b"/>

  <!-- Left Monitor (Code Editor) -->
  <rect x="90" y="110" width="200" height="130" rx="6" fill="#1e1e1e" stroke="#475569" stroke-width="4"/>
  <rect x="180" y="240" width="20" height="40" fill="#475569"/>
  <rect x="160" y="276" width="60" height="6" rx="2" fill="#64748b"/>
  <!-- Editor Code Lines -->
  <rect x="100" y="122" width="60" height="6" rx="2" fill="#38bdf8"/>
  <rect x="100" y="136" width="120" height="5" rx="2" fill="#a855f7"/>
  <rect x="110" y="147" width="140" height="5" rx="2" fill="#4ade80"/>
  <rect x="110" y="158" width="90" height="5" rx="2" fill="#facc15"/>
  <rect x="100" y="170" width="40" height="5" rx="2" fill="#f43f5e"/>
  <rect x="110" y="181" width="150" height="5" rx="2" fill="#cbd5e1"/>
  <rect x="110" y="192" width="110" height="5" rx="2" fill="#38bdf8"/>

  <!-- Right Monitor (Web Live Preview) -->
  <rect x="310" y="110" width="200" height="130" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="4"/>
  <rect x="400" y="240" width="20" height="40" fill="#475569"/>
  <rect x="380" y="276" width="60" height="6" rx="2" fill="#64748b"/>
  <!-- Browser UI -->
  <rect x="310" y="110" width="200" height="20" fill="#e2e8f0"/>
  <circle cx="322" cy="120" r="3" fill="#ef4444"/>
  <circle cx="332" cy="120" r="3" fill="#f59e0b"/>
  <circle cx="342" cy="120" r="3" fill="#10b981"/>
  <rect x="354" y="114" width="140" height="12" rx="3" fill="#ffffff"/>
  <!-- Preview page content -->
  <rect x="325" y="140" width="80" height="14" rx="2" fill="#0f172a"/>
  <rect x="325" y="160" width="170" height="8" rx="2" fill="#94a3b8"/>
  <rect x="325" y="173" width="140" height="8" rx="2" fill="#cbd5e1"/>
  <rect x="325" y="190" width="50" height="16" rx="4" fill="#2563eb"/>
  <rect x="385" y="190" width="50" height="16" rx="4" fill="#e2e8f0"/>

  <!-- Mechanical Keyboard & Mouse -->
  <rect x="230" y="286" width="140" height="10" rx="3" fill="#0f172a"/>
  <rect x="390" y="286" width="24" height="10" rx="5" fill="#0f172a"/>

  <!-- Plant & Coffee Mug -->
  <rect x="70" y="260" width="20" height="20" rx="3" fill="#0284c7"/>
  <path d="M72 260 Q65 240 80 235 Q95 240 88 260" fill="#10b981"/>
  <rect x="500" y="265" width="16" height="15" rx="2" fill="#e2e8f0"/>
  <path d="M516 268 C522 268, 522 277, 516 277" stroke="#e2e8f0" stroke-width="2" fill="none"/>

  <text x="300" y="360" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="500" text-anchor="middle">Ian&apos;s Engineering &amp; Development Workstation</text>
</svg>
