  <rect x="70" y="285" width="80" height="22" rx="4" fill="#312e81"/>
  <text x="110" y="300" fill="#a5b4fc" font-family="monospace" font-size="11" text-anchor="middle">WebSockets</text>
  <rect x="160" y="285" width="60" height="22" rx="4" fill="#1e3a8a"/>
  <text x="190" y="300" fill="#93c5fd" font-family="monospace" font-size="11" text-anchor="middle">Node.js</text>
  <rect x="230" y="285" width="70" height="22" rx="4" fill="#064e3b"/>
