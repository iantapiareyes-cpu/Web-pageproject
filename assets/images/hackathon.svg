<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="hGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="#18181b"/>
  <rect x="30" y="30" width="540" height="340" rx="16" fill="url(#hGrad)" opacity="0.95"/>
  
  <!-- Content Card Inside -->
  <rect x="50" y="50" width="500" height="300" rx="12" fill="#09090b" opacity="0.88"/>
  
  <!-- Trophy / Award Icon -->
  <g transform="translate(70, 75)">
    <circle cx="30" cy="30" r="26" fill="#fbbf24" opacity="0.2"/>
    <circle cx="30" cy="30" r="20" fill="#f59e0b"/>
    <path d="M22 24 H38 V32 C38 36.5 34.5 40 30 40 C25.5 40 22 36.5 22 32 Z" fill="#ffffff"/>
  </g>

  <text x="140" y="95" fill="#fef08a" font-family="system-ui" font-size="12" font-weight="700" letter-spacing="1">FIRST PLACE &bull; HACKATHON 2026</text>
  <text x="140" y="125" fill="#ffffff" font-family="system-ui" font-size="22" font-weight="bold">CollabSphere - Real-time Dev Sync</text>
  
  <text x="70" y="170" fill="#d4d4d8" font-family="system-ui" font-size="14" width="460">
    Led the technical architecture team of 4 engineers building an offline-first
  </text>
  <text x="70" y="195" fill="#d4d4d8" font-family="system-ui" font-size="14">
    collaborative code canvas with instant conflict resolution and live AST validation.
  </text>

