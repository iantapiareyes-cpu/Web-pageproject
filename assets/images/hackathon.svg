  <circle cx="88" cy="248" r="12" fill="#3b82f6"/>
  <text x="88" y="252" fill="#ffffff" font-family="system-ui" font-size="10" font-weight="bold" text-anchor="middle">IT</text>
  <text x="108" y="253" fill="#f4f4f5" font-family="system-ui" font-size="12">Ian (Lead)</text>

  <rect x="210" y="230" width="120" height="36" rx="18" fill="#27272a" stroke="#3f3f46"/>
  <circle cx="228" cy="248" r="12" fill="#10b981"/>
  <text x="228" y="252" fill="#ffffff" font-family="system-ui" font-size="10" font-weight="bold" text-anchor="middle">MK</text>
  <text x="248" y="253" fill="#f4f4f5" font-family="system-ui" font-size="12">Maya (UI)</text>

  <rect x="340" y="230" width="130" height="36" rx="18" fill="#27272a" stroke="#3f3f46"/>
  <circle cx="358" cy="248" r="12" fill="#ec4899"/>
